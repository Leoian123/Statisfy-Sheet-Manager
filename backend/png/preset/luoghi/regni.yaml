# luoghi/regni: una voce per regno, ricavata dai documenti di ambientazione. Dove un documento tace: null.
# popoli: quota su cento abitanti (FONTE Ambientazione.txt). Una razza sotto il 10, o assente, è rara nel luogo.
# conta: che cosa conta per la gente (Status Sociale §3, «Livello 4: nazionale»).

valeria:
  nome: Regno di Valeria
  capitale: {nome: Lumengarde, abitanti: 500000}           # FONTE Ambientazione.txt
  moneta: corona                                           # FONTE Ambientazione.txt e Zona_Alba_Chiara
  culto: Luxor                                             # FONTE Zona_Alba_Chiara (tempio di Luxor); per tutto il regno i documenti tacciono
  popoli: {umano: 85}                                      # FONTE Ambientazione.txt; il resto del 15 non è detto
  conta: [onore, commercio]                                # FONTE Status Sociale §3
  fascia_gente_comune: null
  nomi:                                                    # PROPOSTA, nello stile dei PNG di Zona_Alba_Chiara
    stile: nome di battesimo antico; cognome da mestiere, animale o colore (Ferraguto, Orsini, Orso, Rossi, dei Fabbri)
    m: [Gualtiero, Ottone, Lapo, Cecco, Brunello, Folco, Rinaldo, Ugo, Martino, Corrado, Ilario, Tancredi, Guido, Bernardo]
    f: [Agnese, Bice, Clelia, Dora, Fiora, Gemma, Ida, Mira, Ornella, Tilde, Vanna, Zita, Teodora, Sabina]
    cognomi: [Lupacchi, Mulinari, Carradori, Pecorari, Dal Pozzo, Spigatti, Fornari, Bottai, Tessitori, Vacchetti, Grigi, Volpini, Cardoni, Bianchi]
    # i nomi già usati stanno nelle zone (luoghi/zone.yaml) e nelle schede salvate: il generatore non li ripete

