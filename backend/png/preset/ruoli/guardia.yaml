# ruoli/guardia: dalla tabella «Tipi di PNG generici» di Zona_Alba_Chiara.
eredita: cittadino
descrizione: guardia del posto; ronde, registro dei forestieri, risse
livello:
  villaggio: [20, 45]               # FONTE Zona_Alba_Chiara, «Tipi di PNG generici» e «Legge in vigore»
  citta:     null
  metropoli: null
addestramento: addestrato           # FONTE Zona_Alba_Chiara: colpiscono per uccidere un aggressore
profilo: {STR: alta, DEX: media, VIT: alta, INT: media}     # PROPOSTA
mestiere: {nome: Armi, grado: [III, VI]}                    # PROPOSTA
ricchezza: modesto
atteggiamento: {diffidente: 10, indifferente: 5, interessato: -10}   # FONTE Zona_Alba_Chiara: «formale»; i numeri sono PROPOSTA
dove:      {solo: [posto di guardia, ronda serale, la porta del paese]}   # FONTE Zona_Alba_Chiara
