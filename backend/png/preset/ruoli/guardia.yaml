  intercalare: {solo: ["«nome?»", "«circolare»", "«qui non si fa»", "«parlane col sergente»"]}  # PROPOSTA
no_tipici: {solo: [ha paura di chi comanda, non si fida, crede a una voce falsa]}
malizia:   {aggiungi: [riferire, ricatto piccolo]}
voce:      formale col forestiero, sporca fra colleghi                         # Taratura §6, «Registro»
canone:    [Sergente Hald, Lv 72, capo delle guardie (Zona_Alba_Chiara)]
